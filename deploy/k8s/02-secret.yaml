# M70 · PostgreSQL 口令
#
# ⚠️ 这里的 `agentos` 是**本机演示**用的口令，不是给生产用的。
#
# 上线前必须换掉，而且换的方式是 `kubectl create secret` 而不是改这个文件：
#
#     kubectl -n agentos create secret generic agentos-pg \
#         --from-literal=password="$(openssl rand -base64 24)" \
#         --dry-run=client -o yaml > deploy/k8s/02-secret.yaml
#
# 写在文件里是为了让这份 manifest **可以独立 apply** ——
# 一个"必须先手工建 secret 才能 apply"的目录，会在某次重建集群时
# 让整条部署链断在最前面一步，而报错说的是"secret 不存在"。
#
# 为什么口令只在这里有一份：
# DSN 在 ConfigMap 里（`kubectl get cm -o yaml` 谁都能看），
# 口令在 Secret 里（默认需要 RBAC 授权才读得到）。
# 两边分开，于是"把 ConfigMap 贴进 issue 里讨论"是一件安全的事。
apiVersion: v1
kind: Secret
metadata:
  name: agentos-pg
  namespace: agentos
type: Opaque
stringData:
  password: "agentos"
