# M102 · HPA（M7 Production）。
#
# 此前八份清单里一个 HPA 都没有 —— `replicas: 1` 是写死的。
# 于是"负载上来了"这件事在编排层没有任何出口：要么人手改副本数，
# 要么接受一条 API 一直排队。
#
# ---------------------------------------------------------------------------
# 这里只留了 api；worker 的扩缩容是**业务指标驱动**的，在 08-keda-worker.yaml
#
#   api     IO 密集（收请求、连库），请求一多就排队 → CPU HPA（本文件）
#   worker  计算密集（真跑 Task），活积压就落后     → KEDA 按队列深度扩（08）
#
# ⚠️ 一个 Deployment 的 `replicas` **只能有一个主人**。M102 时 worker 也挂
# 在这里的 CPU HPA 上，M107 改由 KEDA 驱动后必须把它从这里**拿掉** ——
# 两个 autoscaler 同时写 `replicas` 会互相打架（副本数来回摆，且都认为自己是对的）。
#
# 另外六个是**循环型控制进程**（sweeper / controller）：
# 它们的活是"扫一圈、处理一批"，多开一份不会更快 ——
# 只会让同一个 SUSPENDED 被两个进程同时唤醒。它们该是 1，且只有 1。
# ---------------------------------------------------------------------------
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: agentos-api
  namespace: agentos
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: agentos-api
  minReplicas: 1
  maxReplicas: 6
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
  # 缩容要慢、扩容要快 —— 反过来的话，一次抖动会让副本数来回摆，
  # 而每次扩缩都伴随一次连接重建，比"多开一会儿"贵得多。
  behavior:
    scaleDown:
      stabilizationWindowSeconds: 300
      policies:
        - type: Percent
          value: 50
          periodSeconds: 60
    scaleUp:
      stabilizationWindowSeconds: 0
      policies:
        - type: Percent
          value: 100
          periodSeconds: 30
        - type: Pods
          value: 2
          periodSeconds: 30
      selectPolicy: Max
