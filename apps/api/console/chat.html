<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>AgentOS 对话</title>
<style>
  :root{
    --bg:#0b0e13; --bg-deep:#070a0f; --panel:#121722; --panel-2:#171d2a;
    --border:#232c3d; --border-soft:#1c2431; --fg:#e7ecf5; --fg-mute:#a7b0c0;
    --fg-subtle:#6f7b8f; --brand:#5b8cff; --brand-2:#7aa2ff; --ok:#3ecf8e;
    --warn:#e0b341; --bad:#e5646b; --radius:10px; --radius-l:14px;
    --mono:ui-monospace,SFMono-Regular,"SF Mono",Menlo,Consolas,monospace;
  }
  *{box-sizing:border-box}
  html,body{height:100%}
  body{
    margin:0; background:var(--bg); color:var(--fg);
    font:14px/1.6 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,
    "PingFang SC","Microsoft YaHei",sans-serif;
  }
  .app{display:flex; height:100%}

  /* ---------------- 侧边栏 ---------------- */
  .sidebar{
    width:280px; flex:0 0 280px; background:var(--bg-deep);
    border-right:1px solid var(--border-soft); display:flex; flex-direction:column;
    transition:margin-left .2s ease;
  }
  .sidebar.hidden{margin-left:-280px}
  .side-head{padding:14px 14px 10px; display:flex; align-items:center; gap:9px}
  .side-head .mark{
    width:28px;height:28px;border-radius:8px;flex:0 0 28px;
    background:linear-gradient(135deg,var(--brand),#8a5bff);display:grid;place-items:center;
  }
  .side-head .mark svg{width:16px;height:16px;stroke:#fff;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
  .side-head h1{font-size:14px;font-weight:600;margin:0;flex:1}
  .new-btn{
    margin:2px 12px 10px; padding:9px 12px; border-radius:9px; cursor:pointer;
    border:1px dashed var(--border); background:transparent; color:var(--fg-mute);
    font:inherit; text-align:left; transition:.15s;
  }
  .new-btn:hover{border-color:var(--brand); color:var(--fg)}
  .conv-list{flex:1; overflow-y:auto; padding:4px 8px 12px}
  .conv{
    display:flex; align-items:center; gap:8px; padding:9px 10px; border-radius:9px;
    cursor:pointer; color:var(--fg-mute); margin-bottom:2px;
  }
  .conv:hover{background:var(--panel)}
  .conv.on{background:var(--panel-2); color:var(--fg)}
  .conv .txt{flex:1; min-width:0}
  .conv .tt{font-size:13px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap}
  .conv .tm{font-size:10.5px; color:var(--fg-subtle); margin-top:2px}
  .conv .del{
    border:0;background:transparent;color:var(--fg-subtle);cursor:pointer;
    font-size:15px;line-height:1;padding:2px 4px;border-radius:6px;opacity:0;
  }
  .conv:hover .del{opacity:1}
  .conv .del:hover{color:var(--bad);background:var(--panel-2)}
  .side-foot{padding:10px 14px; border-top:1px solid var(--border-soft)}
  .side-foot a{color:var(--fg-mute);text-decoration:none;font-size:12.5px}
  .side-foot a:hover{color:var(--fg)}

  /* ---------------- 主区 ---------------- */
  .chat{flex:1; display:flex; flex-direction:column; min-width:0;
    background:radial-gradient(1100px 500px at 50% -12%,#141b2b 0%,var(--bg) 55%)}
  .chat-head{
    display:flex; align-items:center; gap:10px; padding:12px 18px;
    border-bottom:1px solid var(--border-soft);
    background:oklch(0.2 0.02 260 / 45%); backdrop-filter:blur(8px);
  }
  .chat-head .toggle{
    display:none; border:1px solid var(--border); background:var(--panel);
    color:var(--fg-mute); border-radius:8px; padding:5px 9px; cursor:pointer;
  }
  .chat-head .title{font-size:14px;font-weight:600;flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .chat-head .agent{font-size:11.5px;color:var(--fg-subtle);font-family:var(--mono)}
  main{flex:1; overflow-y:auto; scroll-behavior:smooth}
  .thread{max-width:800px;margin:0 auto;padding:26px 20px 150px;display:flex;flex-direction:column;gap:18px}
  .empty{max-width:560px;margin:12vh auto 0;text-align:center;color:var(--fg-subtle);padding:0 20px}
  .empty .big{font-size:20px;color:var(--fg);font-weight:600;margin-bottom:8px}
  .empty .chips{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;margin-top:18px}
  .empty .chip{border:1px solid var(--border);background:var(--panel);color:var(--fg-mute);
    padding:7px 12px;border-radius:999px;font-size:12.5px;cursor:pointer;transition:.15s}
  .empty .chip:hover{border-color:var(--brand);color:var(--fg)}
  .msg{display:flex;gap:11px;align-items:flex-start}
  .msg .av{width:28px;height:28px;border-radius:8px;flex:0 0 28px;display:grid;place-items:center;font-size:12px;font-weight:600}
  .msg.user{flex-direction:row-reverse}
  .msg.user .av{background:var(--panel-2);color:var(--fg-mute);border:1px solid var(--border)}
  .msg.bot .av{background:linear-gradient(135deg,var(--brand),#8a5bff);color:#fff}
  .bubble{max-width:min(88%,650px);padding:11px 14px;border-radius:var(--radius-l);
    border:1px solid var(--border-soft);white-space:pre-wrap;word-break:break-word}
  .msg.user .bubble{background:var(--brand);border-color:transparent;color:#fff;border-top-right-radius:4px}
  .msg.bot .bubble{background:var(--panel);border-top-left-radius:4px}
  .bubble .meta{display:flex;flex-wrap:wrap;align-items:center;gap:8px;margin-top:9px;padding-top:8px;
    border-top:1px solid var(--border-soft);font-size:11.5px;color:var(--fg-subtle)}
  .bubble .meta code{font-family:var(--mono);font-size:11px}
  .bubble .meta a{color:var(--brand-2);text-decoration:none}
  .bubble .meta a:hover{text-decoration:underline}
  .badge{display:inline-flex;align-items:center;gap:5px;padding:2px 8px;border-radius:999px;font-size:11px;border:1px solid var(--border)}
  .badge.ok{color:var(--ok);border-color:oklch(0.75 0.17 155 / 40%)}
  .badge.warn{color:var(--warn);border-color:oklch(0.8 0.15 90 / 40%)}
  .badge.bad{color:var(--bad);border-color:oklch(0.7 0.18 25 / 40%)}
  .typing{display:inline-flex;gap:4px;padding:3px 0}
  .typing i{width:6px;height:6px;border-radius:50%;background:var(--fg-subtle);animation:b 1.2s infinite}
  .typing i:nth-child(2){animation-delay:.15s}.typing i:nth-child(3){animation-delay:.3s}
  @keyframes b{0%,60%,100%{opacity:.3;transform:translateY(0)}30%{opacity:1;transform:translateY(-3px)}}
  .composer{position:sticky;bottom:0;padding:14px 20px calc(16px + env(safe-area-inset-bottom));
    background:linear-gradient(180deg,transparent,var(--bg) 36%)}
  .composer .box{max-width:800px;margin:0 auto;display:flex;gap:10px;align-items:flex-end;
    background:var(--panel);border:1px solid var(--border);border-radius:var(--radius-l);
    padding:9px 9px 9px 14px;box-shadow:0 12px 40px oklch(0 0 0 / 35%)}
  .composer textarea{flex:1;resize:none;border:0;outline:0;background:transparent;color:var(--fg);
    font:inherit;max-height:180px;padding:6px 0}
  .composer textarea::placeholder{color:var(--fg-subtle)}
  .composer button{border:0;border-radius:9px;background:var(--brand);color:#fff;font-weight:600;
    padding:9px 15px;cursor:pointer;transition:.15s;white-space:nowrap}
  .composer button:hover{background:var(--brand-2)}
  .composer button:disabled{opacity:.45;cursor:not-allowed}
  .composer .hint{max-width:800px;margin:8px auto 0;font-size:11px;color:var(--fg-subtle);text-align:center}
  .err{color:var(--bad)}
  .scrim{display:none}
  @media(max-width:760px){
    .sidebar{position:fixed;z-index:20;height:100%;box-shadow:0 0 40px oklch(0 0 0 / 50%)}
    .chat-head .toggle{display:inline-block}
    .scrim.on{display:block;position:fixed;inset:0;background:oklch(0 0 0 / 45%);z-index:10}
  }
</style>
</head>
<body>
<div class="app">
  <aside class="sidebar" id="sidebar">
    <div class="side-head">
      <span class="mark"><svg viewBox="0 0 24 24"><path d="M12 2 3 7v10l9 5 9-5V7z"/><path d="M12 22V12M12 12 3 7M12 12l9-5"/></svg></span>
      <h1>AgentOS 对话</h1>
    </div>
    <button class="new-btn" id="new-chat">＋ 新对话</button>
    <div class="conv-list" id="conv-list"></div>
    <div class="side-foot"><a href="/console">控制台 · 看 Run / 账本 / 审批 →</a> &nbsp;·&nbsp; <a href="/architecture">架构图</a></div>
  </aside>

  <section class="chat">
    <div class="chat-head">
      <button class="toggle" id="toggle">☰</button>
      <span class="title" id="chat-title">新对话</span>
      <span class="agent">agent-chat</span>
    </div>
    <main id="main">
      <div class="thread" id="thread"></div>
    </main>
    <div class="composer">
      <div class="box">
        <textarea id="input" rows="1" placeholder="给 AgentOS 发一条消息…（Enter 发送，Shift+Enter 换行）"></textarea>
        <button id="send">发送</button>
      </div>
      <div class="hint">多轮：前几轮会一起交给模型 · 每一轮都是一条真实 Run · 回答只读自本次 Run</div>
    </div>
  </section>
</div>
<div class="scrim" id="scrim"></div>

<script>
"use strict";
const AGENT = "agent-chat";
const LS_CONV = "agentos.chat.conversations.v1";
const LS_ACTIVE = "agentos.chat.active.v1";
const MAX_HISTORY = 20;

const $ = (id) => document.getElementById(id);
const main = $("main"), thread = $("thread"), input = $("input"), sendBtn = $("send");
const sidebar = $("sidebar"), scrim = $("scrim");

const esc = (s) => String(s == null ? "" : s).replace(/[&<>"']/g,
  (c) => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));

let conversations = [];
let activeId = "";
let sending = false;

/* ---------------- 持久化 ---------------- */
function load(){
  try {
    const raw = localStorage.getItem(LS_CONV);
    conversations = raw ? JSON.parse(raw) : [];
    if (!Array.isArray(conversations)) conversations = [];
  } catch (e) { conversations = []; }
  try { activeId = localStorage.getItem(LS_ACTIVE) || ""; } catch (e) { activeId = ""; }
}
function save(){
  try { localStorage.setItem(LS_CONV, JSON.stringify(conversations.slice(0, 60))); } catch (e) {}
  try { localStorage.setItem(LS_ACTIVE, activeId); } catch (e) {}
}
function activeConv(){
  return conversations.find((c) => c.id === activeId) || null;
}
function newConv(){
  const c = { id: "c" + Date.now().toString(36) + Math.random().toString(36).slice(2, 6),
              title: "新对话", at: Date.now(), messages: [] };
  conversations.unshift(c);
  activeId = c.id;
  save();
  renderSidebar();
  renderThread();
  closeSidebar();
  input.focus();
  return c;
}
function deleteConv(id){
  const i = conversations.findIndex((c) => c.id === id);
  if (i < 0) return;
  conversations.splice(i, 1);
  if (activeId === id) activeId = conversations.length ? conversations[0].id : "";
  save(); renderSidebar(); renderThread();
}

/* ---------------- 渲染 ---------------- */
function fmtTime(ms){
  const d = new Date(ms || Date.now());
  return d.toLocaleString("zh-CN", { hour12:false, month:"2-digit", day:"2-digit",
    hour:"2-digit", minute:"2-digit" });
}
function renderSidebar(){
  const list = $("conv-list");
  if (!conversations.length){
    list.innerHTML = '<div style="padding:14px 10px;color:var(--fg-subtle);font-size:12px">还没有对话</div>';
    return;
  }
  list.innerHTML = conversations.map(function(c){
    return '<div class="conv ' + (c.id === activeId ? "on" : "") + '" data-conv="' + esc(c.id) + '">' +
      '<div class="txt"><div class="tt">' + esc(c.title || "新对话") + '</div>' +
      '<div class="tm">' + esc(fmtTime(c.at)) + ' · ' + (c.messages ? c.messages.length : 0) + ' 条</div></div>' +
      '<button class="del" data-del="' + esc(c.id) + '" title="删除">×</button></div>';
  }).join("");
}
function emptyState(){
  return '<div class="empty"><div class="big">问点什么吧</div>' +
    '<div>回答由 AgentOS 真实跑出来：创建 Run → 调用模型 → 落账本。左侧控制台能看到每一步。</div>' +
    '<div class="chips"><span class="chip">compute 6*7</span>' +
    '<span class="chip">What is a Redis TTL?</span>' +
    '<span class="chip">用一句话解释什么是 AgentOS</span></div></div>';
}
function msgHtml(m){
  const isUser = m.role === "user";
  const body = m.error
    ? '<span class="err">' + esc(m.content || m.error) + '</span>'
    : esc(m.content || "");
  let meta = "";
  if (!isUser){
    const s = String(m.status || "");
    let cls = "";
    if (s === "completed") cls = "ok";
    else if (s === "suspended" || s === "running" || s === "created") cls = "warn";
    else if (s === "failed" || s === "cancelled") cls = "bad";
    meta = '<div class="meta" ' + (m.runId || m.status ? "" : "hidden") + '>' +
      (m.status ? '<span class="badge ' + cls + '">' + esc(m.status) + '</span>' : "") +
      (m.runId ? '<span>run <code>' + esc(m.runId) + '</code></span>' : "") +
      (m.runId ? '<a href="/console?run=' + encodeURIComponent(m.runId) + '">查看详情 →</a>' : "") +
      '</div>';
  }
  return '<div class="msg ' + (isUser ? "user" : "bot") + '">' +
    '<div class="av">' + (isUser ? "你" : "AI") + '</div>' +
    '<div class="bubble">' + body + meta + '</div></div>';
}
function renderThread(){
  const c = activeConv();
  $("chat-title").textContent = c ? (c.title || "新对话") : "新对话";
  if (!c || !c.messages.length){ thread.innerHTML = emptyState(); return; }
  thread.innerHTML = c.messages.map(msgHtml).join("") +
    '<div id="anchor"></div>';
  scrollDown();
}
function scrollDown(){ main.scrollTop = main.scrollHeight; }
function dropEmpty(){ const e = thread.querySelector(".empty"); if (e) e.remove(); }
function autoGrow(){
  input.style.height = "auto";
  input.style.height = Math.min(input.scrollHeight, 180) + "px";
}
function openSidebar(){ sidebar.classList.remove("hidden"); scrim.classList.add("on"); }
function closeSidebar(){ sidebar.classList.add("hidden"); scrim.classList.remove("on"); }
if (window.innerWidth > 760) sidebar.classList.remove("hidden");

/* ---------------- 发送 ---------------- */
function appendBotShell(){
  dropEmpty();
  const el = document.createElement("div");
  el.className = "msg bot";
  el.innerHTML = '<div class="av">AI</div><div class="bubble">' +
    '<span class="body"><span class="typing"><i></i><i></i><i></i></span></span></div>';
  thread.appendChild(el);
  scrollDown();
  return el;
}

async function send(){
  const message = input.value.trim();
  if (!message || sending) return;
  let c = activeConv();
  if (!c) c = newConv();

  sending = true; sendBtn.disabled = true;
  input.value = ""; autoGrow();

  const firstUser = !c.messages.some((m) => m.role === "user");
  c.messages.push({ role: "user", content: message, at: Date.now() });
  if (firstUser){ c.title = message.slice(0, 28) || "新对话"; }
  c.at = Date.now();
  save(); renderSidebar(); renderThread();

  // 多轮：把这一次之前的历史交给后端（它负责拼成 user_request）。
  const history = c.messages.slice(0, -1)
    .filter((m) => m.role === "assistant" ? !!m.content : !!m.content)
    .slice(-MAX_HISTORY)
    .map((m) => ({ role: m.role, content: m.content }));

  const shell = appendBotShell();
  let res, data = null;
  try {
    res = await fetch("/chat", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ agent_id: AGENT, message: message, history: history }),
    });
    data = await res.json().catch(() => null);
  } catch (e) {
    shell.querySelector(".bubble").innerHTML = '<span class="err">连不上服务：' + esc(String(e)) + "</span>";
    c.messages.push({ role: "assistant", content: "连不上服务：" + String(e), error: true, at: Date.now() });
    save(); sending = false; sendBtn.disabled = false; input.focus();
    return;
  }

  if (!res.ok){
    const code = data && data.error && data.error.code;
    const text = "HTTP " + res.status + (code ? " · " + code : "");
    shell.querySelector(".bubble").innerHTML = '<span class="err">' + esc(text) + "</span>";
    c.messages.push({ role: "assistant", content: text, error: true, at: Date.now() });
  } else {
    const answer = data && data.answer ? String(data.answer) : "";
    const status = data && data.status ? String(data.status) : "";
    const runId = data && data.run_id ? String(data.run_id) : "";
    const shown = answer || (status === "suspended"
      ? "这条 Run 停在了治理闸门上，还没有回答。"
      : "模型没有返回文本。");
    c.messages.push({ role: "assistant", content: shown, runId: runId, status: status, at: Date.now() });
  }
  save(); renderSidebar(); renderThread();
  sending = false; sendBtn.disabled = false; input.focus();
}

/* ---------------- 事件 ---------------- */
sendBtn.addEventListener("click", send);
input.addEventListener("input", autoGrow);
input.addEventListener("keydown", function (e) {
  if (e.key === "Enter" && !e.shiftKey){ e.preventDefault(); send(); }
});
$("new-chat").addEventListener("click", newConv);
$("toggle").addEventListener("click", openSidebar);
scrim.addEventListener("click", closeSidebar);

document.addEventListener("click", function (e) {
  const del = e.target.closest("[data-del]");
  if (del){ e.stopPropagation(); deleteConv(del.dataset.del); return; }
  const item = e.target.closest("[data-conv]");
  if (item){ activeId = item.dataset.conv; save(); renderSidebar(); renderThread(); closeSidebar(); }
  const chip = e.target.closest(".chip");
  if (chip){ input.value = chip.textContent; autoGrow(); input.focus(); }
});

/* ---------------- 启动 ---------------- */
(function init(){
  load();
  if (!conversations.length) newConv();
  else {
    if (!conversations.some((c) => c.id === activeId)) activeId = conversations[0].id;
    renderSidebar(); renderThread();
  }
  input.focus();
})();
</script>
</body>
</html>
